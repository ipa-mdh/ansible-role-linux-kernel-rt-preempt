---
# tasks file for realtime-patch
# newest ansible version is required

- name: Check if default_config exists
  stat:
    path: "{{default_config}}"
  register: stat_result

- name: create working directory
  ansible.builtin.file:
    path: "{{working_dir}}"
    state: directory

- name: Check if kernel exist
  stat:
    path: "{{working_dir}}/linux-{{version}}"
  register: stat_linux

- name: Print if default_config does not exist
  debug:
    msg: "Configure file {{default_config}} does not exist. Please use other file."
  
  when: not stat_result.stat.exists

- name: Include Ubuntu 20.04 vars
  include_vars: vars_ubuntu_20_04.yml
  when: ansible_distribution_version == '20.04'

- name: Include Ubuntu 22.04 vars
  include_vars: vars_ubuntu_22_04.yml
  when: ansible_distribution_version == '22.04'

- name: Include Ubuntu 24.04 vars
  include_vars: vars_ubuntu_24_04.yml
  when: ansible_distribution_version == '24.04'

- name: Install packages to test rt-preempt.
  become: true
  apt:
    name: rt-tests
  tags: dependencies

- name: Install dependencies
  become: true
  apt:
    pkg:
      - libncurses-dev
      - build-essential
  tags: dependencies

- name: Install dependencies to build kernel.
  become: true
  apt:
    name: "{{ packages_to_install }}"
    state: present
    update_cache: true
  tags: dependencies


- name: Download 
  block:
  - name: Download and unarchive
    ansible.builtin.unarchive:
      src: "http://cdn.kernel.org/pub/linux/kernel/v{{version_major}}.x/linux-{{version}}.tar.xz"
      dest: "{{working_dir}}"
      remote_src: yes

  - name: Download 2
    ansible.builtin.get_url:
      url: "http://cdn.kernel.org/pub/linux/kernel/projects/rt/{{version_major}}.{{version_minor}}/patch-{{version_with_rt}}.patch.xz"
      dest: "{{working_dir}}"
      mode: 0755 #rwx r-x r-x
    register: var_patch

  - name: Decompress
    shell: "xz -dk {{var_patch.dest}}"

  when: not stat_linux.stat.exists

- name: Patch
  ansible.posix.patch:
    src: "{{working_dir}}/patch-{{version_with_rt}}.patch"
    strip: 1
    basedir: "{{working_dir}}/linux-{{version}}"
    remote_src: yes

#Creates .config file
- name: Make oldconfig
  ansible.builtin.command:
    cmd: make olddefconfig
    chdir: "{{working_dir}}/linux-{{version}}"
  tags: config

- name: Update config (disable)
  ansible.builtin.command:
    cmd: scripts/config --disable {{item}}
    chdir: "{{working_dir}}/linux-{{version}}"
  loop: "{{scripts_config_disable}}"

- name: Update config (enable)
  ansible.builtin.command:
    cmd: scripts/config --enable {{item}}
    chdir: "{{working_dir}}/linux-{{version}}"
  loop: "{{scripts_config_enable}}"

- name: Update config (set-str)
  ansible.builtin.command:
    cmd: scripts/config --set-str {{item.key}} {{item.value}}
    chdir: "{{working_dir}}/linux-{{version}}"
  loop: "{{scripts_config_set_string}}"

#Updates changes in .config file
- name: Update config
  ansible.builtin.command:
    cmd: make olddefconfig
    chdir: "{{working_dir}}/linux-{{version}}"
  tags: config

# fix: build error: creating source package requires git repository
- name: git repo (init)
  ansible.builtin.command:
    cmd: git init
    chdir: "{{working_dir}}/linux-{{version}}"

- name: git check for untracked or modified files
  command:
    cmd: git status --porcelain
    chdir: "{{working_dir}}/linux-{{version}}"
  register: git_status

- name: git stage all changes if there are any
  ansible.builtin.command:
    cmd: git add .
    chdir: "{{working_dir}}/linux-{{version}}"
  when: git_status.stdout != ""

- name: git commit changes if there are any staged files
  ansible.builtin.command:
    cmd: git commit -m "automated initial commit by Ansible"
    chdir: "{{working_dir}}/linux-{{version}}"
  when: git_status.stdout != ""

#build takes about 50min, but works 
- name: Build Kernel (version <6.3)
  ansible.builtin.command:
    cmd: "make -j {{ansible_facts['processor_vcpus']}} deb-pkg"
    chdir: "{{working_dir}}/linux-{{version}}"
  when: version is version_compare('6.3', '<')
  tags: build

- name: Build Kernel (version >=6.3)
  ansible.builtin.command:
    cmd: "make -j {{ansible_facts['processor_vcpus']}} deb-pkg"
    chdir: "{{working_dir}}/linux-{{version}}"
  when: version is version_compare('6.3', '>=')
  tags: build

- name: install realtime kernel
  become: true
  ansible.builtin.command:
    cmd: dpkg -i *.deb
    chdir: "{{working_dir}}"

- name: Create realtime usergroup 
  become: true
  ansible.builtin.group: 
    name: realtime
    state: present
  tags: user
  
- name: Add user to usergroup
  become: true
  ansible.builtin.user:
    name: "{{ansible_facts['env']['USER']}}"
    groups: realtime
    append: yes
  tags: user

