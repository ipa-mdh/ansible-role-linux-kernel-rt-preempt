- name: Make sure /etc/security/limits.conf contains all values needed
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/security/limits.conf"
    regex: "^{{item}}"
    insertafter: "<domain>      <type>  <item>         <value>\n"
    line: "{{item}}"
  loop: "{{limits_conf_values}}"
  tags: conf
